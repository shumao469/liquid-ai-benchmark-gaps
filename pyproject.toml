[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-revision"
version = "0.1.0"
description = "Reproducible closed-loop experiments for the 2026 liquid neural network revision"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "torch>=2.7",
  "ncps>=1.0.1",
  "gymnasium[mujoco]>=1.1",
  "mujoco>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
liquid-revision = "liquid_revision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liquid_revision = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

