experiment:
  name: offline_smoke
  datasets: [har, physionet2012]
  seeds: [101]
  device: cpu
  deterministic_torch: true

data:
  root: ../revision_data
  manifest_dir: ../manifests/offline
  har:
    split_seed: 20261102
    validation_subject_fraction: 0.20
    sample_period_seconds: 0.02
  physionet2012:
    split_seed: 20261102
    train_fraction: 0.70
    validation_fraction: 0.15
    horizon_hours: 48

features:
  channels: [values, mask, age, dt]

models:
  names: [lstm, ode-rnn, ltc, cfc]
  hidden_dim: 6
  ode_max_step: 1.0
  ltc_ode_unfolds: 3
  cfc_mode: default

training:
  optimizer_steps: 2
  validation_interval: 1
  batch_size: 2
  evaluation_batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0

corruption:
  base_seed: 20261102

latency:
  warmup: 1
  repeats: 3

smoke:
  seed: 909
  max_examples_per_split: 2

